name: Disposable real database workflow integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: superior_workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: superior_workflow_test
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate draft migration names using pinned Supabase CLI
        run: |
          set -eu
          for fix in schedule_revision_fail_closed planner_text_table_identifiers serialize_production_allocation; do
            npx --yes supabase@2.121.0 migration new "$fix"
            target=$(find supabase/migrations -name "*_${fix}.sql" | sort | tail -1)
            source=$(echo "$fix" | tr '_' '-')
            cp "tests/integration/fixes/${source}.sql" "$target"
          done
          mkdir -p artifacts/generated-migrations
          cp supabase/migrations/*_schedule_revision_fail_closed.sql supabase/migrations/*_planner_text_table_identifiers.sql supabase/migrations/*_serialize_production_allocation.sql artifacts/generated-migrations/
          node scripts/validate-schedule-revision-migration.mjs "$(find supabase/migrations -name '*_schedule_revision_fail_closed.sql')"
          node scripts/validate-planner-text-table-migration.mjs "$(find supabase/migrations -name '*_planner_text_table_identifiers.sql')"
          node scripts/validate-production-allocation-migration.mjs "$(find supabase/migrations -name '*_serialize_production_allocation.sql')"
      - name: Apply actual repository migrations to empty disposable PostgreSQL17
        id: schema
        run: bash tests/integration/apply-schema.sh
      - name: Install pinned disposable test dependencies
        run: npm install --no-save --package-lock=false pg@8.16.3 playwright@1.56.1
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Run actual synthetic SQL lifecycle
        run: |
          mkdir -p artifacts/disposable-workflow
          set -o pipefail
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/walls-workflow-cases.sql 2>&1 | tee artifacts/disposable-workflow/sql-lifecycle.log
      - name: Run browser through actual SQL functions and RLS
        if: ${{ always() && steps.schema.outcome == 'success' }}
        run: node tests/integration/workflow-browser.mjs
      - name: Require all corrected SQL edge regressions to pass
        if: ${{ always() && steps.schema.outcome == 'success' }}
        run: |
          node tests/integration/run-known-probes.mjs --strict
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/named-table-extended.sql
      - name: Retain synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-workflow-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
