name: Disposable real database workflow integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: superior_workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: superior_workflow_test
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      EXPECT_PLANNER_DRAFT_PRESERVED: '1'
      EXPECT_MODAL_SAVE_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate narrow SQL repair migrations (filenames generated by Supabase CLI)
        run: |
          node scripts/validate-integrity-guard-migrations.mjs
          node scripts/validate-planner-rebuild-privileges.mjs
          node scripts/validate-production-release-migration.mjs
          node scripts/validate-schedule-revision-migration.mjs supabase/migrations/20261021215455_schedule_revision_fail_closed.sql
          node scripts/validate-planner-text-table-migration.mjs supabase/migrations/20261021215456_planner_text_table_identifiers.sql
          node scripts/validate-production-allocation-migration.mjs supabase/migrations/20261021215458_serialize_production_allocation.sql
      - name: Apply actual repository migrations to empty disposable PostgreSQL17
        id: schema
        run: bash tests/integration/apply-schema.sh
      - name: Install pinned disposable test dependencies
        run: npm install --no-save --package-lock=false pg@8.16.3 playwright@1.56.1
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Run actual synthetic SQL lifecycle
        run: |
          mkdir -p artifacts/disposable-workflow
          set -o pipefail
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/walls-workflow-cases.sql 2>&1 | tee artifacts/disposable-workflow/sql-lifecycle.log
      - name: Verify planner helper authorization with synthetic users
        run: |
          set -o pipefail
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/planner-helper-permissions.sql 2>&1 | tee artifacts/disposable-workflow/planner-helper-permissions.log
      - name: Verify employee projections, raw-table denials and supervisor compatibility
        run: |
          set -o pipefail
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/employee-data-scope.sql 2>&1 | tee artifacts/disposable-workflow/employee-data-scope.log
          node tests/integration/probes/employee-mark-ordered-drift.mjs 2>&1 | tee artifacts/disposable-workflow/employee-mark-ordered-drift.log
      - name: Verify restricted mixed production inventory and Walls QC boundaries
        run: |
          set -o pipefail
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/mixed-employee-scope.sql 2>&1 | tee artifacts/disposable-workflow/mixed-employee-scope.log
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/mixed-employee-approved-packs.sql 2>&1 | tee artifacts/disposable-workflow/mixed-employee-approved-packs.log
      - name: Run browser through actual SQL functions and RLS
        if: ${{ always() && steps.schema.outcome == 'success' }}
        run: node tests/integration/workflow-browser.mjs
      - name: Exercise actual production-board browser controls
        if: ${{ always() && steps.schema.outcome == 'success' }}
        run: node tests/integration/production-browser-lifecycle.mjs
      - name: Require all corrected SQL edge regressions to pass
        if: ${{ always() && steps.schema.outcome == 'success' }}
        run: |
          node tests/integration/probes/migration-prerequisite.mjs
          node --test --test-concurrency=1 tests/integration/probes/mandatory-version-tokens.mjs tests/integration/probes/agent-confirmation-guards.mjs
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/billing-history-roundtrip.sql
          node tests/integration/run-known-probes.mjs --strict
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/named-table-extended.sql
          psql -X --set ON_ERROR_STOP=1 -f tests/integration/probes/walls-release-full-schema.sql
      - name: Record public migration-derived function fingerprints for deployment review
        run: |
          psql -X --csv -c "select p.proname,pg_get_function_identity_arguments(p.oid) as arguments,md5(pg_get_functiondef(p.oid)) as definition_md5 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('advance_walls_production_stage','save_schedule_snapshot','generate_weekly_planner','validate_walls_production_assignment','upsert_walls_production_assignment') order by p.proname" > artifacts/disposable-workflow/repair-function-fingerprints.csv
      - name: Retain synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-workflow-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
