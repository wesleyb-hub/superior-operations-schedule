name: Native owner password acceptance (isolated)
on:
  pull_request:
    paths:
      - 'employee-password-candidate/**'
      - 'tests/integration/employee-owner-password-native*.mjs'
      - 'tests/integration/native-recovery/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/employee-password/**'
      - 'supabase/config.toml'
      - 'scripts/test-employee-password-owner-ui.mjs'
      - 'scripts/validate-employee-password-vendor.mjs'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/employee-owner-password-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-owner-password:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_EMPLOYEE_OWNER_PASSWORD_NATIVE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked synthetic tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate vendored cryptography and synthetic unit contracts
        run: |
          node scripts/validate-employee-password-vendor.mjs
          node --test scripts/test-*.mjs employee-password-candidate/test-*.mjs
      - name: Install the matching isolated test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: JWE handler, real PostgREST and pinned native Auth lifecycle
        run: node tests/integration/employee-owner-password-native.mjs
      - name: Retain only allowlisted secret-free result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-owner-password-native-result
          path: artifacts/employee-owner-password-native/result.json
          if-no-files-found: warn
          retention-days: 7
