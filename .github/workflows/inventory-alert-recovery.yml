name: Inventory alert recovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-inventory-alert-recovery.mjs
      - name: Install pinned Deno for static checking
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.5.2
      - name: Typecheck inventory notification Edge Function (no invocation)
        run: deno check supabase/functions/inventory-reorder-notify/index.ts
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: superior_workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGDATABASE: superior_workflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned disposable test dependency
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Verify real SQL claims and recovery against synthetic records
        run: node tests/integration/inventory-alert-recovery.mjs
