name: Production release SQL regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: production_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify narrow migration scope
        run: node scripts/validate-production-release-migration.mjs
      - name: Test actual RPC migration on disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: >-
          psql -X -h 127.0.0.1 -U postgres -d production_release_test
          --set ON_ERROR_STOP=1
          -f tests/sql/production-release-fixture.sql
          -f supabase/migrations/20261021201500_production_release_fail_closed.sql
          -f tests/sql/production-release-cases.sql
