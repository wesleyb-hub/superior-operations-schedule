name: Security check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-public-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public bundle safety
        run: node scripts/validate-public-bundle.mjs
      - name: Test Operations Assistant read context
        run: node --test scripts/test-operations-agent-context.mjs scripts/test-operations-agent-provider.mjs
      - name: Test session isolation and save recovery
        run: node --test scripts/test-session-save-safety.mjs scripts/test-operational-modal-save.mjs scripts/test-installation-load-safety.mjs
      - name: Verify database migrations
        run: node scripts/validate-migrations.mjs
      - name: Verify privileged RPC grants
        run: node scripts/validate-function-privilege-hardening.mjs
      - name: Verify Operations Assistant safeguards
        run: node scripts/validate-operations-agent.mjs
      - name: Verify Weekly Planner controls
        run: node scripts/validate-weekly-planner.mjs
      - name: Test Weekly Planner refresh ordering
        run: node --test scripts/test-weekly-planner-refresh.mjs scripts/test-weekly-planner-approval.mjs scripts/test-weekly-planner-manual-refresh.mjs scripts/test-weekly-planner-request-budget.mjs scripts/test-weekly-planner-snapshot-queue.mjs
      - name: Test employee picker and persistence contract
        run: node --test scripts/test-planner-employee-picker.mjs
      - name: Test production request ordering and recovery
        run: node --test scripts/test-production-load-safety.mjs scripts/test-production-release-labels.mjs scripts/test-operational-realtime.mjs
      - name: Test billing preservation and rendering boundaries
        run: node --test scripts/test-billing-render-safety.mjs scripts/test-rendered-records.mjs scripts/test-record-id-attributes.mjs
      - name: Verify partial installation release safeguards
        run: node scripts/validate-installation-partial-workflow.mjs
      - name: Verify main Installation activity catalog
        run: node scripts/validate-installation-primary-activities.mjs
      - name: Verify workflow reference and inline syntax
        run: node scripts/validate-workflow-guidance.mjs


  validate-offline-workflow-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ephemeral pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify offline synthetic desktop and mobile views
        run: node scripts/validate-workflow-ui.mjs artifacts/workflow-ui
      - name: Verify synthetic rendering safety on desktop and mobile
        run: node scripts/validate-render-safety-ui.mjs artifacts/workflow-ui/render-safety
      - name: Verify operational modal failure and session recovery
        run: node scripts/validate-operational-modal-ui.mjs artifacts/workflow-ui/modal-recovery
      - name: Retain synthetic screenshots and results for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-workflow-ui
          path: artifacts/workflow-ui
          if-no-files-found: warn
          retention-days: 7

  typecheck-operations-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Deno for static checking
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.5.2
      - name: Typecheck Operations Assistant Edge Function
        # Static analysis only: never starts the server or calls application services.
        run: deno check supabase/functions/operations-agent/index.ts
