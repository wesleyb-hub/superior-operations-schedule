name: Security check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-public-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public bundle safety
        run: node scripts/validate-public-bundle.mjs
