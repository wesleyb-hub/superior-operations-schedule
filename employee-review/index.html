.topbar-inner{max-width:1650px;margin:auto;padding:18px 24px 14px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}

.main{max-width:1650px;margin:auto;padding:22px 24px 60px}

.install-job-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;box-shadow:0 3px 10px rgba(19,40,61,.045);min-width:0;display:flex;flex-direction:column;gap:10px}.install-job-card.has-hold{border-left:4px solid var(--status-hold)}.install-job-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.install-job-card-head h3{margin:0 0 4px;color:var(--navy);font-size:16px;line-height:1.25}.install-job-progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.install-stage{display:grid;grid-template-columns:9px minmax(0,1fr);align-items:center;column-gap:6px;row-gap:1px;min-width:0;color:var(--status-neutral);font-size:10px;font-weight:800}.install-stage-dot{width:9px;height:9px;grid-row:1;grid-column:1;border-radius:50%;background:#b7c1c9}.install-stage small{display:block;grid-column:2;margin:0;color:var(--muted);font-size:9px;line-height:1.2;font-weight:700;text-transform:capitalize}.install-stage.scheduled .install-stage-dot{background:var(--status-planned)}.install-stage.in_progress .install-stage-dot{background:var(--status-review);box-shadow:0 0 0 3px #fff1d6}.install-stage.complete .install-stage-dot{background:var(--status-complete)}.install-stage.hold .install-stage-dot{background:var(--status-hold)}.install-job-next{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:var(--radius-md);background:#f3f6f8;border-left:3px solid var(--accent);font-size:12px}.install-job-next strong{color:var(--navy);white-space:nowrap}.install-job-resource-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;color:#53616c;font-size:11px}.install-job-more{border-top:1px solid var(--line);padding-top:8px;color:#53616c;font-size:12px}.install-job-more summary{cursor:pointer;color:var(--navy);font-weight:800}.install-job-more .production-meta{margin-top:7px}.install-job-card .install-actions{margin-top:auto}
@media(max-width:760px){.install-week-grid{grid-template-columns:minmax(0,1fr);border:0;background:transparent;gap:7px}.install-week-head{display:none}.install-week-job{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;background:#f4f7f9}.install-week-cell{min-height:0;padding:8px 9px 8px 105px;position:relative;border:1px solid var(--line);border-radius:8px;background:#fff}.install-week-cell:before{content:attr(data-day);position:absolute;left:9px;top:9px;width:88px;font-size:11px;font-weight:850;color:var(--navy)}.install-scope-row{grid-template-columns:24px minmax(100px,1fr)}.install-scope-row select{grid-column:2}.install-resource-entry{grid-template-columns:1fr 1fr}.install-resource-entry [data-resource-choice],.install-resource-entry [data-resource-custom],.install-resource-entry [data-resource-role]{grid-column:span 2}.install-resource-entry [data-resource-remove]{grid-column:2}.install-job-tabs button{min-height:42px}.install-job-panel{font-size:14px}}
@media(max-width:760px){.install-job-card{padding:12px}.install-job-card-head{display:block}.install-job-card-head&gt;.install-status{display:inline-flex;margin-top:6px}.install-job-progress{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.install-stage small{font-size:9px}.install-job-resource-summary{grid-template-columns:1fr}.install-job-next{display:block}.install-job-next span{display:block;margin-top:4px}.install-job-card .install-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.install-job-card .install-actions button{min-height:42px}}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.week-title{font-size:20px;font-weight:900;color:var(--navy)}.muted{color:var(--muted)}
.mini{border:1px solid #cfd8df;background:#fff;color:#40505c;padding:6px 8px;border-radius:6px;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;box-shadow:0 3px 10px rgba(19,40,61,.04)}
.stat-label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:25px;font-weight:900;color:var(--navy);margin-top:3px}.stat-foot{font-size:11px;color:#87929c;margin-top:2px}
.section{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.section-head{padding:13px 15px;background:#f8fafb;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:16px;color:var(--navy)}.section-body{padding:14px}
.lookahead{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:760px}

/* WALLS */
.wall-week-grid{display:flex;flex-direction:column;gap:14px}

.wall-week.current{outline:3px solid rgba(200,139,45,.36);border-color:#d79a3d}
.wall-week-head{padding:10px 12px 9px;background:#f8fafb;border-bottom:1px solid var(--line)}
.wall-week.current .wall-week-head{background:var(--accent-soft)}
.wall-week-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.wall-week-date{font-weight:900;color:var(--navy);font-size:14px}
.wall-week-meta{font-size:10px;color:#76818b;margin-top:3px;font-weight:700}
.phase{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:4px 7px;border-radius:99px;font-weight:900;white-space:nowrap;background:#c37a29}
.wall-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.wall-lane{min-width:0;padding:10px;border-right:1px solid #e8edf1}.wall-lane:last-child{border-right:0}
.wall-lane-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#53616c;margin-bottom:8px}
.wall-lane-title span:first-child:before{content:&quot;&quot;;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.wall-lane.dig .wall-lane-title span:first-child:before{background:var(--dig)}
.wall-lane.prod .wall-lane-title span:first-child:before{background:var(--prod)}
.wall-lane.install .wall-lane-title span:first-child:before{background:var(--install)}
.wall-lane-count{font-size:9px;color:#8a959e;font-weight:800}
.wall-lane-list{display:flex;flex-direction:column;gap:8px;min-height:74px}
.wall-job{border:1px solid #e3e8ed;border-radius:9px;padding:9px;background:#fff;min-width:0}
.wall-job.complete{border-color:#bcd9cd;background:#fbfefd}
.wall-job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:8px;color:#fff;border-radius:99px;padding:3px 6px;text-transform:uppercase;letter-spacing:.04em;font-weight:900;white-space:nowrap}
.badge.verity{background:#344f68}.badge.other{background:#687782}.badge.presold{background:#2d7f5e}.badge.inventory{background:#315f93}.badge.btr{background:#6b4c91}.badge.mixed{background:#8a6530}.badge.complete{background:var(--complete)}
.wall-model{font-weight:850;font-size:12px;margin-top:4px;color:#28323b}.wall-dev{font-size:10px;color:#69747e;margin-top:1px}.wall-address{font-size:10.5px;color:#4d5963;margin-top:5px;line-height:1.32}
.milestone{margin-top:7px;padding:6px 7px;border-radius:7px;background:#f5f7f8;font-size:10px;color:#485762;font-weight:800}
.milestone.dig{border-left:3px solid var(--dig)}.milestone.prod{border-left:3px solid var(--prod)}.milestone.install{border-left:3px solid var(--install)}
.wall-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:6px;border-top:1px dashed #e5e9ed;color:#7b8791;font-size:9.5px;gap:8px}
.wall-actions{display:flex;gap:4px;flex-wrap:wrap}.wall-actions button{border:0;background:#eef3f6;color:#455865;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800}
.wall-job.draggable{cursor:grab;transition:opacity .12s ease,border-color .12s ease,background .12s ease;user-select:none}
.wall-job.draggable:active{cursor:grabbing}
.wall-job.dragging{opacity:.45;border-style:dashed}
.wall-lane-list.wall-drop-zone{border:1px dashed transparent;border-radius:8px;padding:3px;transition:background .12s ease,border-color .12s ease}
.wall-lane-list.wall-drop-zone.drag-valid{background:#fff7e9;border-color:#d79a3d}
.wall-lane-list.wall-drop-zone.drag-invalid{background:#fafafa;border-color:#d7dde2}
.drag-hint{font-size:9px;color:#8a959e;margin-top:4px;font-weight:700}
.drag-hint{font-size:9px;color:#7f8b95;margin-top:5px;font-weight:750}.wall-job.draggable button,.wall-job.draggable a{cursor:pointer}


/* PRECAST CURRENT WEEK */
.grid{display:grid;gap:12px}.grid.days{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:20px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;box-shadow:0 4px 12px rgba(19,40,61,.04)}
.day-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.day-name{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}.day-date{font-weight:900;color:var(--navy);font-size:14px}
.capacity{font-size:9px;font-weight:900;padding:4px 6px;border-radius:99px;background:#edf2f5;color:#596673;white-space:nowrap}.capacity.full{background:#fff0dd;color:#8b5b19}.capacity.over{background:#fde8e8;color:#9e3434}
.project-day{border:1px solid #e2e8ed;border-radius:10px;padding:10px;background:#fbfcfd;margin-top:9px}
.job-title{font-weight:900;color:var(--navy);font-size:12px}.job-sub{font-size:10px;color:var(--muted);margin-top:1px}
.product-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.product-row{border:1px solid #e3e8ed;border-radius:8px;padding:7px;background:#fff}
.product-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.product-name{font-size:10px;font-weight:900;color:#33434e}
.product-status{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:3px 5px;background:#edf2f5;color:#5b6872;white-space:nowrap}
.product-status.pre{background:#fff0dd;color:#8b5b19}.product-status.pass{background:#e8f0f8;color:#315f93}.product-status.final{background:#f1eafb;color:#6b4c91}.product-status.released{background:#eaf5f0;color:#23664d}.product-status.hold{background:#fde8e8;color:#9e3434}
.product-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.product-actions button{border:1px solid #cfd8df;background:#fff;color:#40505c;padding:4px 6px;border-radius:6px;font-size:9px;font-weight:800}
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.project-card{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}.project-top{display:flex;justify-content:space-between;gap:10px}.project-name{font-size:14px;font-weight:900;color:var(--navy)}
.progress{height:9px;border-radius:99px;background:#e7ecef;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:var(--blue)}.project-meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-top:8px}

/* COLLAPSIBLE SPECIALS LIST */
.project-specials-dropdown{margin-top:8px;border:1px solid #e3e9ee;border-radius:8px;background:#fbfcfd;overflow:hidden}
.project-specials-dropdown summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;min-height:38px;user-select:none}
.project-specials-dropdown summary::-webkit-details-marker{display:none}
.project-specials-dropdown summary:hover{background:#f4f7f9}
.project-specials-summary{font-size:10px;color:var(--muted)}
.project-specials-summary strong{color:#40505c}
.project-specials-toggle{display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-size:9px;font-weight:900;white-space:nowrap}
.project-specials-open-label{display:none}
.project-specials-chevron{display:inline-block;font-size:12px;line-height:1;transition:transform .15s ease}
.project-specials-dropdown[open] .project-specials-closed-label{display:none}
.project-specials-dropdown[open] .project-specials-open-label{display:inline}
.project-specials-dropdown[open] .project-specials-chevron{transform:rotate(180deg)}
.project-specials-list{padding:0 10px 5px;border-top:1px solid #e7ecef;background:#fff}
@media(max-width:760px){.project-specials-dropdown summary{align-items:flex-start;flex-wrap:wrap}.project-specials-toggle{margin-left:auto}}

/* QC */
.queue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.queue{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.queue-head{padding:10px 12px;background:#f7f9fa;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#5c6974;display:flex;justify-content:space-between}
.queue-body{padding:10px;min-height:100px}

  &lt;details class=&quot;workflow-reference no-print&quot; id=&quot;wallsWorkflowReference&quot; hidden&gt;
    &lt;summary&gt;Superior Walls workflow reference&lt;/summary&gt;
    &lt;div class=&quot;workflow-reference-body&quot;&gt;
      &lt;p&gt;Physical handoffs from the team workflow dated October 20, 2026. These are connected workstreams, not a single serial schedule. This reference does not change Hub statuses or approval requirements.&lt;/p&gt;
      &lt;ol class=&quot;workflow-reference-grid&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Release and advance CNC work&lt;/strong&gt;Approved drawings and Approved for Production precede physical setup. Plan CNC foam cutting and insulated stud assembly ahead of wall production; stage the finished studs for setup rather than waiting for a table to enter setup.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Setup, inspect, then pour&lt;/strong&gt;Complete physical table setup, then inspect every production run. Setup Complete is not the same as Ready for Pour: correct any failed pre-pour checks before pouring.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Walls before pads and columns&lt;/strong&gt;Pad and column forms and reinforcement can be prepared alongside wall work. Pour wall beds first, then pads and columns, then full-crew cleanup. Strip pads and columns the next morning and store until needed.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Morning inspection is final plant QC&lt;/strong&gt;After dropping lids, inspect and patch as needed before panel handling. Final QC Release records that morning inspection result; it does not call for a second physical inspection after loading. Resolve holds and record the appropriate release before dispatch.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Site and stone work run in parallel&lt;/strong&gt;For our installation scope, shoot grade, place and screed stone footing, and establish wall lines before the delivery truck arrives. Stone footing is field work, distinct from manufactured footing pads.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Install and close out the contracted scope&lt;/strong&gt;Set and brace panels, check squareness, caulk, add slab-on-grade foam only where applicable, complete top bolting, and clean up. Supply-only jobs follow the customer's contract: do not assume Superior Walls owns freight, crane, or field installation.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p class=&quot;workflow-reference-note&quot;&gt;Use approved drawings and existing load documentation. This reference adds no bed-layout or load-sheet generation, material quantities, official height names, BOMs, labor standards, or accounting codes. The team must confirm those separately.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

function normalizeDate(value){

  if(m){
    const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);
    const dt=new Date(Date.UTC(y,mo-1,d));

    const dt=new Date(Date.UTC(y,mo-1,d));

    return iso(dt)
  }

  if(/^\d+(\.\d+)?$/.test(s)){
    const serial=Number(s);
    if(serial&gt;20000&amp;&amp;serial&lt;80000){
      const dt=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);
      return Number.isNaN(dt.getTime())?'':iso(dt)
    }
  }

  const guess=new Date(s);
  if(!Number.isNaN(guess.getTime())){
    return iso(new Date(Date.UTC(guess.getFullYear(),guess.getMonth(),guess.getDate())))

}

function syncLinkedDelivery(type,id){
  let source=null,division='',project='',date='',load='',qty=1;
  if(type==='wall'){
    source=state.walls.find(w=&gt;w.id===id);
    if(!source)return;
    division='walls';
    project=source.job||source.project||'Wall Job';
    date=source.deliveryDate||'';
    load='Wall Job Delivery';
    qty=Math.max(1,Number(source.units||1));
  }else{
    source=state.jobs.find(j=&gt;j.id===id);
    if(!source)return;
    division=source.division;
    project=source.name||'Precast Project';
    date=source.deliveryDate||'';
    load='Whole Project Delivery';
    qty=Math.max(1,Number(source.total||1));
  }

  let existing=linkedLoadFor(type,id);
  const deliveredExisting=state.loads.find(l=&gt;l.linkType===type&amp;&amp;l.linkId===id&amp;&amp;l.status==='Delivered');if(deliveredExisting)return;

  if(!date){
    if(existing&amp;&amp;existing.status==='Scheduled'){
      state.loads=state.loads.filter(l=&gt;l.id!==existing.id)
    }
    return
  }

  if(existing){
    existing.date=date;
    existing.division=division;
    existing.project=project;
    existing.load=load;
    existing.qty=qty;
    existing.linkType=type;
    existing.linkId=id;
    existing.autoLinked=true;
  }else{
    state.loads.push({
      id:'d'+Date.now()+Math.random().toString(16).slice(2,6),
      date,division,project,load,qty,status:'Scheduled',
      linkType:type,linkId:id,autoLinked:true
    })
  }
}

function bindDeliveryDragDrop(){
  let dragId=null,dragCard=null;
  const clear=()=&gt;{
    if(dragCard)dragCard.classList.remove('dragging');
    document.querySelectorAll('[data-delivery-drop-date]').forEach(z=&gt;z.classList.remove('drag-over'));
    dragId=null;dragCard=null
  };

  document.querySelectorAll('[data-drag-delivery]').forEach(card=&gt;{
    card.addEventListener('dragstart',e=&gt;{
      if(e.target.closest('button,input,a,select,textarea')){e.preventDefault();return}
      dragId=card.dataset.dragDelivery;
      dragCard=card;
      card.classList.add('dragging');
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}catch(_){}
    });
    card.addEventListener('dragend',clear)
  });

  document.querySelectorAll('[data-delivery-drop-date]').forEach(zone=&gt;{
    zone.addEventListener('dragover',e=&gt;{
      e.preventDefault();
      zone.classList.add('drag-over');
      try{e.dataTransfer.dropEffect='move'}catch(_){}
    });
    zone.addEventListener('dragleave',()=&gt;zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=&gt;{
      e.preventDefault();
      const id=dragId||(()=&gt;{try{return e.dataTransfer.getData('text/plain')}catch(_){return''}})();
      const date=zone.dataset.deliveryDropDate;
      clear();
      if(id&amp;&amp;date)moveDelivery(id,date)
    })
  })
}

function undoProductionCompletion(projectId,productId){
  const j=projectById(projectId),p=productById(j,productId);

  const linkedLoad=state.loads.find(l=&gt;l.linkType==='project'&amp;&amp;l.linkId===j.id&amp;&amp;['Loaded','Delivered'].includes(l.status));
  if(linkedLoad){
    alert(`This project has a delivery marked ${linkedLoad.status}. Correct the delivery status before undoing production completion.`);
    return
  }

  const wasReleased=p.status==='released';
  const label=productDisplayName(j,p);
  const qty=Number(p.qty||1);
  const unit=divisionMeta[j.division]?.unit||'item(s)';
  const message=wasReleased
    ?`Undo ${label}? This will reverse its Final QC release and return ${qty} ${unit} to the production schedule as Pre-QC Passed.`
    :`Undo ${label}? This will return ${qty} ${unit} to the production schedule as Pre-QC Passed.`;

  if(!confirm(message))return;

  p.status='pre-passed';
  p.pouredDate='';
  if(wasReleased)p.releasedDate='';

  if(wasReleased){
    state.qcHistory.push({
      date:todayISO(),
      timestamp:new Date().toISOString(),
      weekKey:operationsWeekKey(new Date()),
      project:j.name,
      product:label,
      action:'Production completion undone / Final QC release reversed',
      user:state.role||'User'

  }

    if(j.stage==='Complete'||j.stage==='Ready to Ship')j.stage='Production';
    if(j.completedDate)j.completedDate=''
  }

  saveState();
  render()
}

function renderWalls(){
  const sub=state.subview.walls||'current';
  if(sub==='production'){renderWallsProduction();return}
  if(sub==='installation'&amp;&amp;wallSubviewAllowed('installation')){renderWallsInstallationEnhanced();return}
  if(sub==='overall'){renderWallsOverall();return}
  if(sub==='year'){renderWallsYearOutlook();return}
  if(sub==='active'){renderWallsActive();return}
  if(sub==='plans'){renderWallsPlanReview();return}
  if(sub==='monthly'){renderWallsMonthly();return}

  const active=state.walls.filter(w=&gt;!wallIsCompleted(w)),
        digs=active.filter(w=&gt;weekStart(w.digDate)===state.week),
        prods=active.filter(w=&gt;weekStart(w.productionDate)===state.week),
        installs=active.filter(w=&gt;weekStart(w.installDate)===state.week),
        released=prods.filter(w=&gt;wallPlanReleased(w)).length,
        planHold=prods.length-released,
        cm=state.walls.filter(w=&gt;wallCompletionMonth(w)===state.reportMonth);

  document.getElementById('view').innerHTML=`${divisionSubtabs('walls')}
    &lt;div class=&quot;stats&quot;&gt;
      ${kpi('Active Wall Jobs',active.length)}
      ${kpi('Digs This Week',digs.length)}
      ${kpi('Production This Week',prods.length)}
      ${currentUserIsAdmin?kpi('Released for Production',released):''}
      ${currentUserIsAdmin?kpi('Plan Review Hold',planHold,planHold?'Production scheduled but not released':''):''}
      ${kpi('Installs This Week',installs.length)}
      ${kpi('Completed This Month',cm.length)}
    &lt;/div&gt;
    &lt;div class=&quot;toolbar&quot; style=&quot;margin:0 0 12px&quot;&gt;
      &lt;div class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;Current Week is intentionally focused only on this week’s Digs, Production, and Installs.&lt;/div&gt;
      ${currentUserIsAdmin?'&lt;button type=&quot;button&quot; class=&quot;mini&quot; id=&quot;addWallBtn&quot;&gt;+ Add Wall Job&lt;/button&gt;':''}
    &lt;/div&gt;
    &lt;div class=&quot;wall-week-grid&quot;&gt;${wallWeekCard(state.week,false)}&lt;/div&gt;`;
  bindWallControls()
}

                &lt;/td&gt;`:''}

      const month=monthInput?.value||'';
      if(!month){alert('Choose the month this job was completed first.');monthInput?.focus();return}
      quickCompleteWall(id,month,true)
    }
  });

  const bulk=document.getElementById('completeSelectedWalls');
  if(bulk){
    bulk.onclick=()=&gt;{
      const ids=[...document.querySelectorAll('[data-wall-select]:checked')].map(cb=&gt;cb.dataset.wallSelect);

      ids.forEach(id=&gt;quickCompleteWall(id,month,false));
      syncBilling();saveState();render()
    }
  }
}

function renderWallsPlanReview(){

function moveWallMilestone(wallId,stage,targetWeek){
  const w=state.walls.find(x=&gt;x.id===wallId);if(!w)return;
  const key=wallDateKey(stage),oldDate=w[key];if(!oldDate)return;
  const oldWeek=weekStart(oldDate);
  const offset=Math.max(0,Math.round((parseDate(oldDate)-parseDate(oldWeek))/86400000));
  const newDate=addDays(targetWeek,offset);
  if(newDate===oldDate)return;
  w[key]=newDate;
  logAction('Wall Schedule',`${w.job}: ${wallStageLabel(stage)} moved ${oldDate} → ${newDate}`);
  saveState();
  render()
}
function bindWallDragDrop(){
  const board=document.querySelector('.wall-week-grid');
  if(!board)return;

  let dragInfo=null;
  let draggingCard=null;

  const clearDragUI=()=&gt;{
    if(draggingCard)draggingCard.classList.remove('dragging');
    document.querySelectorAll('[data-wall-drop-stage]').forEach(zone=&gt;zone.classList.remove('drag-valid','drag-invalid'));
    dragInfo=null;
    draggingCard=null
  };

  // The entire job card is the grab area. Controls inside the card remain normal click controls.
  board.querySelectorAll('.wall-job[data-drag-wall]').forEach(card=&gt;{
    card.addEventListener('dragstart',e=&gt;{
      if(e.target.closest('button,a,input,select,textarea')){
        e.preventDefault();
        return
      }
      dragInfo={wallId:card.dataset.dragWall,stage:card.dataset.dragStage};
      draggingCard=card;
      card.classList.add('dragging');

      try{
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',JSON.stringify(dragInfo))
      }catch(_){}

      board.querySelectorAll('[data-wall-drop-stage]').forEach(zone=&gt;{
        const valid=zone.dataset.wallDropStage===dragInfo.stage;
        zone.classList.toggle('drag-valid',valid);
        zone.classList.toggle('drag-invalid',!valid)
      })
    });

    card.addEventListener('dragend',clearDragUI)
  });

  board.querySelectorAll('[data-wall-drop-stage]').forEach(zone=&gt;{
    zone.addEventListener('dragover',e=&gt;{
      let info=dragInfo;
      if(!info){
        try{info=JSON.parse(e.dataTransfer.getData('text/plain')||'null')}catch(_){}
      }
      if(!info||zone.dataset.wallDropStage!==info.stage)return;
      e.preventDefault();
      try{e.dataTransfer.dropEffect='move'}catch(_){}
    });

    zone.addEventListener('drop',e=&gt;{
      e.preventDefault();
      let info=dragInfo;
      if(!info){
        try{info=JSON.parse(e.dataTransfer.getData('text/plain')||'null')}catch(_){}
      }
      if(!info||zone.dataset.wallDropStage!==info.stage){
        clearDragUI();
        return
      }

      moveWallMilestone(info.wallId,info.stage,zone.dataset.wallDropWeek);
      clearDragUI()
    })
  });

  // Non-drag fallback.
  board.querySelectorAll('[data-move-wall]').forEach(btn=&gt;{
    btn.onclick=e=&gt;{
      e.stopPropagation();
      const {moveWall:wallId,moveStage:stage,moveDays:delta}=btn.dataset;
      const w=state.walls.find(x=&gt;x.id===wallId);if(!w)return;
      const key=wallDateKey(stage),oldDate=w[key];if(!oldDate)return;
      moveWallMilestone(wallId,stage,addDays(weekStart(oldDate),Number(delta)))
    }
  })
}

function yearWeekStarts(year){
  const first=weekStart(`${year}-01-01`),last=weekStart(`${year}-12-31`),weeks=[];
  let d=first,guard=0;
  while(d&amp;&amp;d&lt;=last&amp;&amp;guard&lt;60){weeks.push(d);d=addDays(d,7);guard++}
  return weeks
}
function yearMonthGroups(weeks,year){
  const out=[];
  weeks.forEach((w,i)=&gt;{
    const anchor=addDays(w,3),key=anchor.slice(0,7),label=parseDate(anchor).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'});
    const last=out[out.length-1];
    if(last&amp;&amp;last.key===key)last.span++;
    else out.push({key,label,start:i+2,span:1})
  });
  return out
}
function yearWeekIndex(weeks,date){const wk=weekStart(date);return weeks.indexOf(wk)}
function yearHeaderGrid(weeks,label,year){
  const groups=yearMonthGroups(weeks,year),current=weekStart(todayISO());
  return `&lt;div class=&quot;year-gantt&quot; style=&quot;--weeks:${weeks.length}&quot;&gt;
    &lt;div class=&quot;year-corner&quot;&gt;${label}&lt;/div&gt;
    ${groups.map(g=&gt;`&lt;div class=&quot;year-month-label&quot; style=&quot;grid-column:${g.start}/span ${g.span}&quot;&gt;${g.label}&lt;/div&gt;`).join('')}
  &lt;/div&gt;
  &lt;div class=&quot;year-gantt&quot; style=&quot;--weeks:${weeks.length}&quot;&gt;
    &lt;div class=&quot;year-week-corner&quot;&gt;Week of&lt;/div&gt;
    ${weeks.map(w=&gt;`&lt;div class=&quot;year-week-head ${w===current?'current':''}&quot; title=&quot;Week of ${fmt(w)}&quot;&gt;${Number(w.slice(8,10))}&lt;/div&gt;`).join('')}
  &lt;/div&gt;`
}
function yearCells(weeks){
  const current=weekStart(todayISO());
  return weeks.map((w,i)=&gt;`&lt;div class=&quot;year-cell ${w===current?'current-week':''} ${i===0||addDays(w,3).slice(5,7)!==addDays(weeks[i-1]||w,3).slice(5,7)?'month-start':''}&quot;&gt;&lt;/div&gt;`).join('')
}
function yearBarHtml(weeks,start,end,label,classes='',title=''){
  if(!start)return'';
  const first=yearWeekIndex(weeks,start),last=yearWeekIndex(weeks,end||start);
  if(first&lt;0&amp;&amp;last&lt;0)return'';
  const a=Math.max(0,first&lt;0?0:first),b=Math.min(weeks.length-1,last&lt;0?a:last),span=Math.max(1,b-a+1);
  return `&lt;div class=&quot;year-bar ${htmlSafe(classes)}&quot; style=&quot;grid-column:${a+2}/span ${span};grid-row:1&quot; title=&quot;${htmlSafe(title||label)}&quot;&gt;${htmlSafe(label)}&lt;/div&gt;`
}
function projectProductionDates(j){
  return (j.products||[]).flatMap(p=&gt;pieceScheduleDates(p)).filter(Boolean).sort()
}
function projectProductionSpanForYear(j,year){
  const y=String(year);
  const dates=projectProductionDates(j).filter(d=&gt;d.startsWith(y));
  if(!dates.length)return {start:'',end:'',days:0};
  return {start:dates[0],end:dates[dates.length-1],days:new Set(dates).size}
}

function precastSpecialMarkers(j,weeks,year){
  const marks=[];

      const idx=yearWeekIndex(weeks,d);if(idx&lt;0||seen.has(idx))return;seen.add(idx);
      marks.push(`&lt;div class=&quot;year-special-marker&quot; style=&quot;grid-column:${idx+2};grid-row:1&quot; title=&quot;${htmlSafe(label)} · Production ${fmt(d)}&quot;&gt;&lt;/div&gt;`)
    })
  });

    &lt;div class=&quot;stats&quot;&gt;${kpi('Production Jobs in '+year,jobs.length)}${kpi('Scheduled Production Qty',scheduledQty.toLocaleString()+' '+m.unit)}${kpi('Unscheduled Specials',unscheduledSpecials)}&lt;/div&gt;

/* PRECAST + PIECE LEVEL QC */
function productStatusText(p){
  return ({scheduled:'Scheduled', 'pre-ready':'Pre-QC Needed','pre-passed':'Pre-QC Passed','final-needed':'Final QC Needed',released:'Released',hold:'QC Hold'})[p.status]||p.status
}
function productStatusClass(p){return p.status==='pre-ready'?'pre':p.status==='pre-passed'?'pass':p.status==='final-needed'?'final':p.status==='released'?'released':p.status==='hold'?'hold':''}

function productDisplayName(j,p){
  if(p?.isSpecial){
    const id=(p.structureId||p.label||p.pieceType||'Special Piece').trim();
    const type=(p.pieceType||'').trim();
    const size=(p.pieceSize||'').trim();
    const bits=[id];
    if(type&amp;&amp;type.toLowerCase()!==id.toLowerCase()&amp;&amp;!id.toLowerCase().startsWith(type.toLowerCase()))bits.push(type);
    if(size)bits.push(size);
    return bits.join(' — ')
  }
  if(j?.division==='boxes'){
    const id=(p.structureId||'').trim();
    const type=(p.pieceType||'').trim();
    const size=(p.pieceSize||'').trim();
    if(id||size||p.isSpecial)return [id||p.label||'Box Piece',type|| (p.isSpecial?'Special Piece':'Box Section'),size].filter(Boolean).join(' — ');
    return p.label||'Box Section'
  }
  if(j?.division!=='manholes')return p.label||'Piece';
  const left=(p.structureId||'').trim();
  const type=(p.pieceType||'').trim();
  const size=(p.pieceSize||'').trim();
  if(left||type||size)return [left||'Manhole Piece',type,size].filter(Boolean).join(' — ');
  return p.label||'Manhole Piece'
}
function manholePieceDetail(p){
  const bits=[];
  if(p.structureId)bits.push(p.structureId);
  if(p.pieceType)bits.push(p.pieceType);
  if(p.pieceSize)bits.push(p.pieceSize);
  return bits.join(' · ')
}

function renderProjectSpecials(j){
  if(!['boxes','manholes'].includes(j?.division))return'';
  const specials=(j.products||[]).filter(p=&gt;p.isSpecial);
  if(!specials.length)return `&lt;div class=&quot;job-sub&quot; style=&quot;margin-top:7px&quot;&gt;&lt;strong&gt;Specials:&lt;/strong&gt; none added yet.&lt;/div&gt;`;
  const scheduled=specials.filter(p=&gt;p.plannedDate).length;
  const unscheduled=specials.length-scheduled;
  const rows=specials.map(p=&gt;{
    const dates=pieceScheduleDates(p);
    const schedule=p.plannedDate
      ? `${fmt(p.plannedDate)}${dates.length&gt;1?' → '+fmt(dates[dates.length-1]):''}`
      : 'Unscheduled';
    return `&lt;div style=&quot;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f4&quot;&gt;

      &lt;button type=&quot;button&quot; class=&quot;mini&quot; data-edit-piece=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;${p.plannedDate?'Edit Schedule':'Schedule'}&lt;/button&gt;
    &lt;/div&gt;`
  }).join('');
  return `&lt;details class=&quot;project-specials-dropdown&quot;&gt;
    &lt;summary&gt;
      &lt;span class=&quot;project-specials-summary&quot;&gt;&lt;strong&gt;Specials:&lt;/strong&gt; ${specials.length} total · ${scheduled} scheduled · ${unscheduled} unscheduled&lt;/span&gt;

    &lt;/summary&gt;
    &lt;div class=&quot;project-specials-list&quot;&gt;${rows}&lt;/div&gt;
  &lt;/details&gt;`
}

function renderProductRow(j,p){
  let actions='';
  if(p.status==='scheduled')actions=`&lt;button data-pre=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;This Piece → Pre-QC&lt;/button&gt;`;
  else if(p.status==='pre-passed')actions=`&lt;button data-pour=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;Mark THIS Piece Poured&lt;/button&gt;`;
  else if(p.status==='pre-ready')actions=`&lt;span class=&quot;muted&quot; style=&quot;font-size:9px&quot;&gt;Waiting on QC&lt;/span&gt;`;
  else if(p.status==='final-needed')actions=`&lt;span class=&quot;muted&quot; style=&quot;font-size:9px&quot;&gt;Waiting on Final QC&lt;/span&gt;`;
  else if(p.status==='hold')actions=`&lt;span class=&quot;muted&quot; style=&quot;font-size:9px&quot;&gt;QC Hold&lt;/span&gt;`;
  else if(p.status==='released')actions=`&lt;span class=&quot;muted&quot; style=&quot;font-size:9px&quot;&gt;✓ This piece released&lt;/span&gt;`;

  if(['boxes','manholes'].includes(j.division)){
    actions=`&lt;button type=&quot;button&quot; data-edit-piece=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;Edit Piece&lt;/button&gt;${actions}`;

  return `&lt;div class=&quot;product-row&quot;&gt;
    &lt;div class=&quot;product-top&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;product-name&quot;&gt;${htmlSafe(productDisplayName(j,p))}&lt;/div&gt;${secondary}&lt;/div&gt;
      &lt;span class=&quot;product-status ${productStatusClass(p)}&quot;&gt;${htmlSafe(productStatusText(p))}&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;product-actions&quot;&gt;${actions}&lt;/div&gt;
  &lt;/div&gt;`

function renderPrecast(div){

  if(sub==='overall'){renderPrecastOverall(div);return}
  if(sub==='year'){renderPrecastYearOutlook(div);return}
  if(sub==='monthly'){renderPrecastMonthly(div);return}

  const m=divisionMeta[div],
        allDivJobs=state.jobs.filter(j=&gt;j.division===div),
        js=allDivJobs.filter(j=&gt;!j.completedDate),
        planned=allDivJobs.reduce((n,j)=&gt;n+weekDates().reduce((a,d)=&gt;a+plannedQtyForDate(j,d),0),0),
        scheduledPoured=allDivJobs.reduce((n,j)=&gt;n+weekDates().reduce((a,d)=&gt;a+actualQtyForDate(j,d),0),0),
        weeklyCompletions=productionCompletionsForWeek(div,state.week),
        completedThisWeek=weeklyCompletions.reduce((n,x)=&gt;n+Number(x.product.qty||1),0),
        remaining=js.reduce((n,j)=&gt;n+Math.max(0,j.total-producedQty(j)),0),
        qcWaiting=allProducts().filter(x=&gt;x.project.division===div&amp;&amp;['pre-ready','final-needed','hold'].includes(x.product.status)).length,
        completionPct=planned?Math.min(100,Math.round(completedThisWeek/planned*100)):0;

  const days=weekDates().map(d=&gt;{
    const projects=js.filter(j=&gt;(j.products||[]).some(p=&gt;pieceIsScheduledOn(p,d))),
          planTotal=projects.reduce((n,j)=&gt;n+plannedQtyForDate(j,d),0),
          cls=planTotal&gt;m.capacity?'over':planTotal===m.capacity?'full':'';
    return `&lt;div class=&quot;day&quot;&gt;
      &lt;div class=&quot;day-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;day-name&quot;&gt;${weekday(d)}&lt;/div&gt;&lt;div class=&quot;day-date&quot;&gt;${fmt(d)}&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;capacity ${cls}&quot;&gt;${planTotal}/${m.capacity} ${m.unit}&lt;/span&gt;&lt;/div&gt;
      ${projects.length?projects.map(j=&gt;{
        const c=pieceCountsForDate(j,d);
        return `&lt;div class=&quot;project-day&quot;&gt;
          &lt;button class=&quot;job-link&quot; data-project=&quot;${htmlSafe(j.id)}&quot;&gt;${htmlSafe(j.name)}&lt;/button&gt;
          &lt;div class=&quot;job-sub&quot;&gt;${htmlSafe(j.type)}&lt;/div&gt;

function openPieceModal(projectId,pieceId){
  const j=projectById(projectId),p=productById(j,pieceId);
  if(!j||!p||!['boxes','manholes'].includes(j.division))return;
  editingPieceProjectId=projectId;editingPieceId=pieceId;
  const isBox=j.division==='boxes',isSpecial=!!p.isSpecial;
  document.getElementById('pieceModalTitle').textContent=isSpecial
    ? `Schedule / Edit ${isBox?'Box':'Manhole'} Special`
    : `Edit Regular ${isBox?'Box Section':'Manhole Piece'}`;
  document.getElementById('mpCategoryField').style.display='none';
  document.getElementById('mpDurationField').style.display=isSpecial?'block':'none';
  document.getElementById('mpCategory').value=isSpecial?'special':'regular';
  document.getElementById('mpStructureLabel').textContent=isBox?'Piece ID / Name':'Manhole / Piece ID';
  document.getElementById('mpSizeLabel').textContent=isBox?'Size / Description':'Piece Size / Diameter';
  document.getElementById('mpStructure').value=p.structureId||'';
  document.getElementById('mpPieceType').value=p.pieceType||(isBox?(isSpecial?'Special Piece':'Box Section'):(isSpecial?'Special Piece':'Manhole Piece'));
  document.getElementById('mpPieceSize').value=p.pieceSize||'';
  document.getElementById('mpDate').value=p.plannedDate||'';
  document.getElementById('mpDuration').value=Math.max(1,Number(p.productionDays||1));
  document.getElementById('mpNotes').value=p.pieceNotes||'';
  document.getElementById('mpDateHelp').textContent=isSpecial
    ? 'Leave blank to keep this special unscheduled. Assign a date when production is ready for it.'
    : 'Regular pieces are scheduled from the job Start Date and Pieces Per Day.';
  document.getElementById('pieceModalHelp').innerHTML=isSpecial
    ? `&lt;strong&gt;Special scheduling:&lt;/strong&gt; choose the production start date when the scheduler is ready to place this special on the schedule. Production Days reserves consecutive weekdays and can be changed at any time before production.`
    : `&lt;strong&gt;Regular production:&lt;/strong&gt; this piece is part of the job's auto-scheduled regular production. Use this screen for the piece ID, type, size, notes, or a one-piece date adjustment.`;
  document.getElementById('pieceModal').style.display='flex'
}
function saveManholePiece(){
  const j=projectById(editingPieceProjectId),p=productById(j,editingPieceId);
  if(!j||!p)return;
  p.structureId=document.getElementById('mpStructure').value.trim();
  p.pieceType=document.getElementById('mpPieceType').value.trim();
  p.pieceSize=document.getElementById('mpPieceSize').value.trim();
  const rawDate=document.getElementById('mpDate').value;
  if(p.isSpecial){
    p.plannedDate=rawDate?nextProductionDay(rawDate):'';
    p.productionDays=Math.max(1,Number(document.getElementById('mpDuration').value)||1);
    if(!p.pieceType)p.pieceType='Special Piece'
  }else{
    p.plannedDate=nextProductionDay(rawDate||p.plannedDate||j.startDate||state.week);
    p.productionDays=1;
    if(!p.pieceType)p.pieceType=j.division==='boxes'?'Box Section':'Manhole Piece'
  }
  p.pieceNotes=document.getElementById('mpNotes').value.trim();
  logAction(p.isSpecial?'Special Piece':(j.division==='boxes'?'Box Piece':'Manhole Piece'),`${j.name}: ${productDisplayName(j,p)} updated${p.isSpecial&amp;&amp;!p.plannedDate?' and left unscheduled':p.isSpecial&amp;&amp;p.plannedDate?' · scheduled '+p.plannedDate+' for '+p.productionDays+' production day'+(p.productionDays===1?'':'s'):''}`);
  saveState();closeModal('pieceModal');render()
}
function addSpecialPiece(projectId){
  const j=projectById(projectId);if(!j||!['boxes','manholes'].includes(j.division))return;
  const specialNumber=(j.products||[]).filter(p=&gt;p.isSpecial).length+1;
  const id=j.id+'-sp'+Date.now()+'-'+Math.random().toString(16).slice(2,5);
  const p={
    id,label:'Special '+specialNumber,structureId:'',pieceType:'',pieceSize:'',pieceNotes:'',qty:1,
    plannedDate:'',productionDays:1,isSpecial:true,status:'scheduled'
  };
  j.products.push(p);
  j.total=Math.max(0,Number(j.regularPieceCount||0)+(j.products||[]).filter(x=&gt;x.isSpecial).length);
  logAction('Special Piece',`${j.name}: new unscheduled special added`);
  saveState();render();
  openPieceModal(j.id,p.id)
}

function bindPrecastControls(div){
  bindSubtabs(div);
  document.querySelectorAll('[data-project]').forEach(b=&gt;b.onclick=()=&gt;openProjectModal(b.dataset.project));
  document.querySelectorAll('[data-pre]').forEach(b=&gt;b.onclick=()=&gt;{const {pre:j,pieceId:p}=b.dataset;markPreReady(j,p)});
  document.querySelectorAll('[data-pour]').forEach(b=&gt;b.onclick=()=&gt;{const {pour:j,pieceId:p}=b.dataset;markPoured(j,p)});
  document.querySelectorAll('[data-edit-piece]').forEach(b=&gt;b.onclick=()=&gt;{const {editPiece:j,pieceId:p}=b.dataset;openPieceModal(j,p)});
  document.querySelectorAll('[data-add-special]').forEach(b=&gt;b.onclick=()=&gt;addSpecialPiece(b.dataset.addSpecial));
  const a=document.getElementById('addPrecastBtn');if(a)a.onclick=()=&gt;openProjectModal(null,div)
}
function markPreReady(projectId,productId){const j=projectById(projectId),p=productById(j,productId);if(!p||p.status!=='scheduled')return;p.status='pre-ready';p.preReadyDate=todayISO();logAction('Production',`${j.name} ${productDisplayName(j,p)}: ready for Pre-QC`);saveState();render()}
function markPoured(projectId,productId){const j=projectById(projectId),p=productById(j,productId);if(!p||p.status!=='pre-passed')return;p.status='final-needed';p.pouredDate=todayISO();logAction('Production',`${j.name} ${productDisplayName(j,p)}: marked poured`);saveState();render()}

function renderQC(){
  const all=allProducts(),pre=all.filter(x=&gt;x.product.status==='pre-ready'),finals=all.filter(x=&gt;x.product.status==='final-needed'),holds=all.filter(x=&gt;x.product.status==='hold'),releasedToday=all.filter(x=&gt;x.product.status==='released'&amp;&amp;x.product.releasedDate===todayISO()).length,logWeek=currentLogWeek(),weekQC=state.qcHistory.filter(h=&gt;eventWeekKey(h)===logWeek);
  const queue=(title,items,type)=&gt;`&lt;div class=&quot;queue&quot;&gt;&lt;div class=&quot;queue-head&quot;&gt;&lt;span&gt;${title}&lt;/span&gt;&lt;span&gt;${items.length}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;queue-body&quot;&gt;${items.length?items.map(({project:j,product:p})=&gt;`&lt;div class=&quot;qc-card&quot;&gt;&lt;div class=&quot;qc-product&quot;&gt;${htmlSafe(productDisplayName(j,p))}&lt;/div&gt;&lt;div class=&quot;qc-project&quot;&gt;${htmlSafe(j.name)} · ${htmlSafe(j.type)}&lt;/div&gt;&lt;div class=&quot;qc-meta&quot;&gt;${divisionMeta[j.division].label} · Planned ${fmt(p.plannedDate)}${htmlSafe(p.qty&gt;1?' · '+p.qty+' '+divisionMeta[j.division].unit:'')}&lt;/div&gt;&lt;div class=&quot;qc-actions&quot;&gt;${type==='hold'?`&lt;button class=&quot;pass&quot; data-release-hold=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;Release Hold&lt;/button&gt;`:`&lt;button class=&quot;pass&quot; data-qc-pass=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;Pass ${type==='pre'?'Pre-QC':'Final QC'}&lt;/button&gt;&lt;button class=&quot;hold&quot; data-qc-hold=&quot;${htmlSafe(j.id)}&quot; data-piece-id=&quot;${htmlSafe(p.id)}&quot;&gt;Hold&lt;/button&gt;`}&lt;/div&gt;&lt;/div&gt;`).join(''):'&lt;div class=&quot;empty&quot;&gt;Nothing waiting&lt;/div&gt;'}&lt;/div&gt;&lt;/div&gt;`;
  document.getElementById('view').innerHTML=`&lt;div class=&quot;stats&quot;&gt;${kpi('Pre-QC Needed',pre.length)}${kpi('Final QC Needed',finals.length)}${kpi('QC Holds',holds.length)}${kpi('Released Today',releasedToday)}&lt;/div&gt;&lt;div class=&quot;queue-grid&quot;&gt;${queue('Pre-QC Needed',pre,'pre')}${queue('Final QC Needed',finals,'final')}${queue('QC Holds',holds,'hold')}&lt;/div&gt;${renderWallsQcQueue()}&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;This Week — QC Activity&lt;/h3&gt;&lt;div class=&quot;muted&quot; style=&quot;font-size:10px&quot;&gt;Resets from the working view Friday at 5:00 PM; full history is kept in History.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;section-body&quot;&gt;${weekQC.slice().reverse().slice(0,12).map(h=&gt;`&lt;div class=&quot;history-row&quot;&gt;&lt;div&gt;${fmt(h.date)}&lt;/div&gt;&lt;div&gt;&lt;strong&gt;${htmlSafe(h.product)}&lt;/strong&gt;&lt;div class=&quot;job-sub&quot;&gt;${htmlSafe(h.project)}&lt;/div&gt;&lt;/div&gt;&lt;div&gt;${htmlSafe(h.action)}&lt;/div&gt;&lt;div&gt;${htmlSafe(h.user||'QC Team')}&lt;/div&gt;&lt;/div&gt;`).join('')||'&lt;div class=&quot;empty&quot;&gt;No QC activity yet.&lt;/div&gt;'}&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;notice&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span&gt;&lt;strong&gt;QC flow:&lt;/strong&gt; Every precast piece moves independently. Superior Walls has a separate final-QC release tied to each stripped production assignment; plan approval does not substitute for final inspection.&lt;/span&gt;&lt;/div&gt;`;
  document.querySelectorAll('[data-qc-pass]').forEach(b=&gt;b.onclick=()=&gt;{const {qcPass:j,pieceId:p}=b.dataset;passQC(j,p)});
  document.querySelectorAll('[data-qc-hold]').forEach(b=&gt;b.onclick=()=&gt;{const {qcHold:j,pieceId:p}=b.dataset;holdQC(j,p)});
  document.querySelectorAll('[data-release-hold]').forEach(b=&gt;b.onclick=()=&gt;{const {releaseHold:j,pieceId:p}=b.dataset;releaseHold(j,p)})
  document.querySelectorAll('[data-wall-qc]').forEach(b=&gt;b.onclick=async()=&gt;{const [id,status]=b.dataset.wallQc.split('|');const note=status==='hold'?prompt('QC hold reason:'):prompt('Optional final inspection note:');if(note!==null)await wallsInstallationRpc('set_walls_installation_qc',{p_assignment_id:id,p_status:status,p_note:note},status==='released'?'Superior Walls final QC released.':'Superior Walls QC status recorded.')})

function renderWallsQcQueue(){if(!currentUserIsAdmin)return'';if(!wallsInstallationReady)return `&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;h3&gt;Superior Walls — Final QC&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;section-body&quot;&gt;&lt;div class=&quot;production-warning&quot;&gt;${htmlSafe(wallsInstallationError||'Loading the separate Superior Walls final-QC release queue…')}&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;const rows=(wallsInstallation.jobs||[]).flatMap(j=&gt;(j.production||[]).map(a=&gt;({j,a,q:(j.qc||[]).find(x=&gt;x.assignment_id===a.assignment_id)}))).filter(x=&gt;x.a.stage==='stripped'||x.q?.status==='hold');return `&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Superior Walls — Final QC Release&lt;/h3&gt;&lt;div class=&quot;muted&quot; style=&quot;font-size:10px&quot;&gt;Separate from pre-production plan review. Only stripped assignments with no open production hold can be released.&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill ${rows.some(x=&gt;x.a.stage==='stripped'&amp;&amp;x.q?.status!=='released')?'risk':'on'}&quot;&gt;${rows.length} assignments&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;section-body&quot;&gt;${rows.length?rows.map(({j,a,q})=&gt;`&lt;article class=&quot;install-card ${q?.status==='hold'?'hold':q?.status==='released'?'completed':''}&quot;&gt;&lt;strong&gt;${htmlSafe(j.job.job||j.record_id)} · Table ${htmlSafe(a.table_id)} · ${htmlSafe(productionHeightLabel(a.wall_height))}&lt;/strong&gt;&lt;div class=&quot;production-meta&quot;&gt;${Number(a.actual_poured_lf||a.planned_lf||0).toLocaleString()} LF · Production stage ${htmlSafe(PRODUCTION_STAGE_LABELS[a.stage]||a.stage)} · QC ${htmlSafe(q?.status||'pending')}${j.open_production_issues?` · ${j.open_production_issues} open production hold(s)`:''}&lt;/div&gt;${q?.inspection_note?`&lt;div class=&quot;production-meta&quot;&gt;${htmlSafe(q.inspection_note)}&lt;/div&gt;`:''}&lt;div class=&quot;install-actions&quot;&gt;${q?.status==='released'?'&lt;span class=&quot;install-status released&quot;&gt;Final QC released&lt;/span&gt;':`&lt;button class=&quot;mini&quot; data-wall-qc=&quot;${htmlSafe(a.assignment_id)}|released&quot; ${a.stage==='stripped'&amp;&amp;!Number(j.open_production_issues||0)?'':'disabled'}&gt;Pass final QC / release&lt;/button&gt;`}${q?.status==='hold'?`&lt;button class=&quot;mini&quot; data-wall-qc=&quot;${htmlSafe(a.assignment_id)}|pending&quot;&gt;Clear QC hold&lt;/button&gt;`:`&lt;button class=&quot;mini&quot; data-wall-qc=&quot;${htmlSafe(a.assignment_id)}|hold&quot;&gt;Place QC hold&lt;/button&gt;`}&lt;/div&gt;&lt;/article&gt;`).join(''):'&lt;div class=&quot;empty&quot;&gt;No stripped Superior Walls assignments are awaiting final QC.&lt;/div&gt;'}&lt;/div&gt;&lt;/section&gt;`}
function passQC(projectId,productId){

/* DELIVERY */
function openWallsInstallationLoadMap(loadRecordId){
  const activeLoad=state.loads.find(x=&gt;x.id===loadRecordId);
  const historyLoad=state.deliveryHistory.find(x=&gt;x.id===loadRecordId);
  const load=activeLoad||historyLoad&amp;&amp;{...historyLoad,status:'Delivered'};
  if(!load||!(load.division==='walls'||load.linkType==='wall')||!installationCanManage()){alert('This delivered wall load is not available for Installation run linking.');return}
  const job=installationJob(load.linkId)||(wallsInstallation.jobs||[]).find(x=&gt;x.job?.job===load.project);
  if(!job){alert('Installation data is still loading. Refresh the Delivery view and try again.');return}
  const link=(job.delivery||[]).find(x=&gt;x.record_id===loadRecordId),selected=new Set(link&amp;&amp;link.assignment_ids||[]),delivered=load.status==='Delivered';
  if(delivered&amp;&amp;selected.size){alert('This delivered load already has an audited run list. It is locked to preserve shipment history.');return}
  const qc=new Map((job.qc||[]).map(q=&gt;[q.assignment_id,q]));
  const activeProduction=(job.production||[]).filter(a=&gt;a.stage!=='cancelled');
  const eligible=a=&gt;a.stage==='stripped'&amp;&amp;qc.get(a.assignment_id)&amp;&amp;qc.get(a.assignment_id).status==='released'&amp;&amp;!Number(job.open_production_issues||0);
  const rows=activeProduction.map(a=&gt;{
    const canSelect=!delivered||eligible(a),checked=selected.has(a.assignment_id),qcStatus=qc.get(a.assignment_id)&amp;&amp;qc.get(a.assignment_id).status||'not released';
    return '&lt;label class=&quot;field&quot; style=&quot;display:flex;align-items:flex-start;gap:8px;opacity:'+(canSelect?'1':'.58')+'&quot;&gt;&lt;input type=&quot;checkbox&quot; data-load-assignment=&quot;'+htmlSafe(a.assignment_id)+'&quot; '+(checked?'checked ':'')+(!canSelect?'disabled ':'')+'&gt;&lt;span&gt;&lt;strong&gt;Table '+htmlSafe(a.table_id)+' · '+htmlSafe(productionHeightLabel(a.wall_height))+' · '+Number(a.planned_lf||0).toLocaleString()+' LF&lt;/strong&gt;&lt;div class=&quot;job-sub&quot;&gt;'+htmlSafe(PRODUCTION_STAGE_LABELS[a.stage]||a.stage)+' · Final QC '+htmlSafe(qcStatus)+(delivered&amp;&amp;!eligible(a)?' · not eligible for delivered shipment':'')+'&lt;/div&gt;&lt;/span&gt;&lt;/label&gt;'
  }).join('');
  const title=delivered?'Assign runs to delivered shipment':'Assign production runs to shipment';
  const intro=delivered?load.project+' · '+load.load+'. Record the exact production runs physically included in this already-delivered shipment. This adds traceability only; it does not change delivery status. The run list locks after saving.':load.project+' · '+load.load+'. Assign the exact production runs carried by this load so Installation can select what arrived. Without a partial-run list, delivery QC applies to the whole job.';
  const body=(rows||'&lt;div class=&quot;production-empty&quot;&gt;No active production runs are recorded for this job.&lt;/div&gt;')+(delivered?'&lt;div class=&quot;production-warning&quot; style=&quot;margin-top:10px&quot;&gt;Only stripped, finally QC-released runs with no open production hold can be added. Confirm the list matches the actual shipment.&lt;/div&gt;':'');
  const canSave=!delivered||activeProduction.some(eligible);
  const saveLabel=delivered?'Record delivered runs':'Save shipment runs';
  const saveAction=canSave?async()=&gt;{
    const user=currentUser,client=sb,epoch=hubSessionEpoch;const current=()=&gt;currentUser===user&amp;&amp;sb===client&amp;&amp;hubSessionEpoch===epoch&amp;&amp;productionModalSaveAction===saveAction;
    const ids=[...document.querySelectorAll('[data-load-assignment]:checked')].map(x=&gt;x.dataset.loadAssignment);
    const feedback=document.getElementById('loadMapFeedback');
    if(delivered&amp;&amp;!ids.length){
      if(feedback){feedback.hidden=false;feedback.textContent='Select at least one exact production run included in this shipment.'}
      return
    }
    if(delivered&amp;&amp;!confirm('Confirm these exact runs were included in this already-delivered shipment? This adds the audited run-to-load link only; it does not change delivery status.'))return;
    const saveButton=document.getElementById('productionModalSave');
    if(saveButton){saveButton.disabled=true;saveButton.textContent='Recording…'}
    try{
      const saved=await wallsInstallationRpc('link_walls_installation_load_assignments',{p_load_record_id:loadRecordId,p_assignment_ids:ids},delivered?'Delivered shipment runs recorded for Installation.':'Production runs assigned to the shipment.');
      if(!current())return;
      if(saved){
        closeProductionModal();
        if(state.view==='delivery')render()
      }else if(saveButton){
        saveButton.disabled=false;saveButton.textContent=saveLabel
      }
    }catch(error){
      if(!current())return;
      console.error('Could not save delivered shipment run links:',error);
      if(feedback){feedback.hidden=false;feedback.textContent='The run list was not saved. Your selections are still here; retry after the connection is restored.'}
      if(saveButton){saveButton.disabled=false;saveButton.textContent=saveLabel}
    }
  }:null;
  openProductionModal(title,intro,body+(delivered?'&lt;div id=&quot;loadMapFeedback&quot; class=&quot;production-warning&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;':''),saveLabel,saveAction)
}

function applyImport(){
  const div=document.getElementById('importDivision').value,maps={};
  document.querySelectorAll('[data-map]').forEach(s=&gt;maps[s.dataset.map]=s.value);

  let added=0,updated=0,skipped=0,badDates=0,firstImportedDate='';

  for(const row of importData){
    const v=k=&gt;maps[k]?String(row[maps[k]]??'').trim():'';

    if(div==='walls'){
      const job=v('job');
      if(!job){skipped++;continue}

      const rawDig=v('digDate'),rawProd=v('productionDate'),rawInstall=v('installDate');
      const digDate=normalizeDate(rawDig),productionDate=normalizeDate(rawProd),installDate=normalizeDate(rawInstall);

      if(rawDig&amp;&amp;!digDate)badDates++;
      if(rawProd&amp;&amp;!productionDate)badDates++;
      if(rawInstall&amp;&amp;!installDate)badDates++;

      const candidateDate=digDate||productionDate||installDate;
      if(candidateDate&amp;&amp;(!firstImportedDate||candidateDate&lt;firstImportedDate))firstImportedDate=candidateDate;

      let w=state.walls.find(x=&gt;String(x.job).trim().toLowerCase()===job.toLowerCase());

      const customer=v('customer'),project=v('project'),type=v('type'),address=v('address');
      const lf=nonnegativeNumber(v('lf')),units=Number(v('units')||1);
      const heightMap={h4:'lf4',h5:'lf5',h8:'lf8',h9:'lf9',h10:'lf10',h12:'lf12'};
      const hasHeightImport=Object.values(heightMap).some(k=&gt;Boolean(maps[k]));
      const importedHeights=Object.fromEntries(Object.entries(heightMap).map(([heightKey,importKey])=&gt;[heightKey,nonnegativeNumber(v(importKey))]));

      if(w){
        if(customer)w.customer=customer;
        if(project)w.project=project;
        if(type)w.type=type;
        if(address)w.address=address;
        if(hasHeightImport){const existingHeights=wallHeightBreakdown(w);Object.entries(heightMap).forEach(([heightKey,importKey])=&gt;{if(maps[importKey])existingHeights[heightKey]=importedHeights[heightKey]});w.lfByHeight=existingHeights}
        if(maps.lf){const importedHeightTotal=wallHeightTotal(w);w.lfUnassigned=Math.max(0,lf-importedHeightTotal)}
        normalizeWallLF(w);
        if(Number.isFinite(units)&amp;&amp;units&gt;0)w.units=units;
        if(digDate)w.digDate=digDate;
        if(productionDate)w.productionDate=productionDate;
        if(installDate)w.installDate=installDate;
        updated++;
      }else{
        state.walls.push({
          id:'wi'+Date.now()+Math.random().toString(16).slice(2),
          job,source:'Other',saleType:'Other',
          customer,project,type,address,lfByHeight:importedHeights,lfUnassigned:hasHeightImport?(maps.lf?Math.max(0,lf-Object.values(importedHeights).reduce((n,x)=&gt;n+x,0)):0):lf,lf,units:Number.isFinite(units)&amp;&amp;units&gt;0?units:1,
          digDate,productionDate,installDate,
          completedDate:'',status:'On Track',constraint:'',notes:'Imported schedule',links:[]
        });
        normalizeWallLF(state.walls[state.walls.length-1]);added++;
      }
    }else{
      const name=v('name');
      if(!name){skipped++;continue}

      let j=state.jobs.find(x=&gt;x.division===div&amp;&amp;String(x.name).trim().toLowerCase()===name.toLowerCase());
      const total=Math.max(1,Number(v('total')||1));
      const rate=Math.max(1,Number(v('rate')||1));
      const rawStart=v('startDate'),rawCompleted=v('completedDate');
      const startDate=normalizeDate(rawStart)||state.week;
      const completedDate=normalizeDate(rawCompleted);

      if(rawStart&amp;&amp;!normalizeDate(rawStart))badDates++;
      if(rawCompleted&amp;&amp;!completedDate)badDates++;

      if(startDate&amp;&amp;(!firstImportedDate||startDate&lt;firstImportedDate))firstImportedDate=startDate;

      if(j){
        j.customer=v('customer')||j.customer;
        j.type=v('type')||j.type;
        if(['boxes','manholes'].includes(j.division))rebuildIndividualProjectSchedule(j,total,rate,startDate);
        else{j.total=total;rebuildBulkProjectSchedule(j,total,rate,startDate)}
        if(completedDate)j.completedDate=completedDate;
        updated++;
      }else{
        const id='ji'+Date.now()+Math.random().toString(16).slice(2);
        state.jobs.push({
          id,division:div,name,customer:v('customer'),type:v('type')||'General',
          total,status:'On Track',stage:'Production',completedDate,
          constraint:'',notes:'Imported schedule',links:[],baseProduced:0,
          products:buildProducts(div,total,rate,startDate,id)
        });
        added++;
      }
    }
  }

  logAction('Import',`${div}: ${added} added, ${updated} updated, ${skipped} skipped, ${badDates} invalid dates ignored from ${document.getElementById('importSource').value}`);
  syncBilling();

  // Always return cleanly to the division dashboard after importing.
  state.view=div;
  state.subview[div]='current';

  // Jump to the earliest valid imported week so the user can see the new data.
  if(firstImportedDate){
    state.week=weekStart(firstImportedDate);
    state.year=Number(firstImportedDate.slice(0,4));
  }

  saveState();
  alert(`Import complete: ${added} added, ${updated} updated, ${skipped} skipped.${badDates?` ${badDates} invalid date value(s) were ignored so they could not break the dashboard.`:''}`);
  render()

function htmlSafe(value){return String(value??'').replace(/[&amp;&lt;&gt;&quot;']/g,ch=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[ch]))}

function buildOperationalExceptions(){

  state.walls.filter(w=&gt;!wallIsCompleted(w)).forEach(w=&gt;{

  });

  state.loads.filter(l=&gt;l.status!=='Delivered'&amp;&amp;l.date&amp;&amp;l.date&lt;today).forEach(l=&gt;add({severity:'High',division:l.division==='walls'?'Superior Walls':divisionMeta[l.division]?.label||l.division,record:l.project,type:'Past-due delivery',owner:'Field Operations / Logistics',next:'Verify readiness and reschedule or complete delivery',due:l.date,blocker:`Status is ${l.status}`}));

  const rank={Critical:0,High:1,Medium:2};return rows.sort((a,b)=&gt;(rank[a.severity]-rank[b.severity])||String(a.due).localeCompare(String(b.due)))

function matchingOperationsRecords(q){

function nextProductionDay(date){
  let d=normalizeDate(date),guard=0;
  while(d&amp;&amp;guard&lt;14){
    const dow=parseDate(d).getUTCDay();
    if(dow!==0&amp;&amp;dow!==6)return d;
    d=addDays(d,1);guard++
  }
  return d
}
function buildProducts(div,total,rate,start,id){
  const products=[],meta=divisionMeta[div];
  let left=Math.max(0,Number(total||0));
  const perDay=Math.max(1,Number(rate||1));
  let d=nextProductionDay(start),index=1,guard=0;

  // Boxes/manholes are tracked as individual pieces.
  if(div==='boxes'||div==='manholes'){
    while(left&gt;0&amp;&amp;guard&lt;2000){
      const q=Math.min(perDay,left);
      for(let i=0;i&lt;q;i++){
        products.push({
          id:id+'-p'+index,
          label:div==='manholes'?'Manhole Piece '+index:meta.itemLabel+' '+index,
          structureId:'',pieceType:div==='boxes'?'Box Section':'Manhole Piece',pieceSize:'',pieceNotes:'',
          qty:1,plannedDate:d,productionDays:1,isSpecial:false,status:'scheduled'
        });
        index++;left--
      }
      d=nextProductionDay(addDays(d,1));guard++
    }
  }else{
    while(left&gt;0&amp;&amp;guard&lt;2000){
      const q=Math.min(perDay,left);
      products.push({id:id+'-p'+index,label:meta.itemLabel+' '+index,qty:q,plannedDate:d,productionDays:1,isSpecial:false,status:'scheduled'});
      index++;left-=q;
      d=nextProductionDay(addDays(d,1));guard++
    }
  }
  return products
}
function projectProductionSpan(j){
  const dates=(j.products||[]).flatMap(p=&gt;pieceScheduleDates(p)).filter(Boolean).sort();
  if(!dates.length)return {start:'',end:'',days:0};
  return {start:dates[0],end:dates[dates.length-1],days:new Set(dates).size}
}
function rebuildIndividualProjectSchedule(j,total,rate,start){
  if(!j||!['boxes','manholes'].includes(j.division))return;
  const target=Math.max(0,Number(total||0));
  const perDay=Math.max(1,Number(rate||1));
  const products=j.products||[];
  const specials=products.filter(p=&gt;p.isSpecial);
  const regular=products.filter(p=&gt;!p.isSpecial);
  const progressed=regular.filter(p=&gt;p.status!=='scheduled');
  let future=regular.filter(p=&gt;p.status==='scheduled');
  const needed=Math.max(0,target-progressed.length);

  if(future.length&gt;needed)future=future.slice(0,needed);
  while(future.length&lt;needed){
    const n=progressed.length+future.length+1;
    future.push({
      id:j.id+'-p'+Date.now()+'-'+n+'-'+Math.random().toString(16).slice(2,6),
      label:j.division==='boxes'?'Box '+n:'Manhole Piece '+n,
      structureId:'',pieceType:j.division==='boxes'?'Box Section':'Manhole Piece',pieceSize:'',pieceNotes:'',
      qty:1,plannedDate:'',productionDays:1,isSpecial:false,status:'scheduled'
    })
  }

  let d=nextProductionDay(start),slot=0;
  future.forEach(p=&gt;{
    p.isSpecial=false;p.productionDays=1;
    p.plannedDate=d;
    slot++;
    if(slot&gt;=perDay){slot=0;d=nextProductionDay(addDays(d,1))}
  });

  j.products=[...progressed,...future,...specials].sort((a,b)=&gt;(a.plannedDate||'').localeCompare(b.plannedDate||''));
  j.regularPieceCount=target;
  j.total=target+specials.length;
  j.dailyRate=perDay;
  j.startDate=nextProductionDay(start)
}
function rebuildBulkProjectSchedule(j,total,rate,start){
  if(!j||!['block','fence'].includes(j.division))return;
  const progressed=(j.products||[]).filter(p=&gt;p.status!=='scheduled');
  const progressedQty=progressed.reduce((n,p)=&gt;n+Number(p.qty||0),0);
  const remaining=Math.max(0,Number(total||0)-progressedQty);

  // Preserve anything already moved through production/QC. Rebuild only future scheduled work.
  const rebuilt=remaining&gt;0
    ? buildProducts(j.division,remaining,rate,start,j.id+'-r'+Date.now())
    : [];

  j.products=[...progressed,...rebuilt].sort((a,b)=&gt;(a.plannedDate||'').localeCompare(b.plannedDate||''));
  j.dailyRate=Math.max(1,Number(rate||1));
  j.startDate=normalizeDate(start);
}

function saveProject(){

      if(!j){showProjectFormMessage('That project could not be found. Close this window and try again.');return}
      Object.assign(j,{name,customer,type,stage,status,completedDate,deliveryDate,constraint,notes,links,startDate:start,dailyRate:rate});
      if(['boxes','manholes'].includes(j.division)){
        const progressedRegular=(j.products||[]).filter(p=&gt;!p.isSpecial&amp;&amp;p.status!=='scheduled').length;
        if(total&lt;progressedRegular){showProjectFormMessage(`Regular quantity cannot be less than ${progressedRegular} because those pieces have already entered production / QC.`);return}

        const addedSpecials=buildSpecialProducts(j.division,newSpecialRows,j.id);

      }

        constraint,notes,links,baseProduced:0,products,startDate:nextProductionDay(start),dailyRate:rate,

      });

      logAction('Project Add',`${name} added to ${divisionMeta[div].label}`);
      syncLinkedDelivery('project',id);

&lt;script&gt;
(()=&gt;{
  const primary=[['site_preparation','Site readiness'],['stone_footing','Stone footing'],['wall_installation','Wall install'],['field_closeout','Field closeout']];
  const labels=new Map([...primary,['loading_hauling','Loading &amp; hauling (legacy)'],['panel_readiness','Panel readiness (legacy)'],['other','Other (legacy)']]);
  const style=document.createElement('style');
  style.textContent='#view .install-job-progress{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:760px){#view .install-job-progress{grid-template-columns:repeat(2,minmax(0,1fr))}}';
  document.head.append(style);
  function configureActivitySelect(select,keepLegacy){
    if(select.dataset.primaryActivityTypes==='true')return;
    const selected=select.value,options=primary.map(([value,label])=&gt;new Option(label,value));
    if(keepLegacy&amp;&amp;!primary.some(([value])=&gt;value===selected)){const label=labels.get(selected)||selected.replaceAll('_',' ');options.push(new Option(label.includes('(legacy)')?label:`${label} (legacy)`,selected))}
    select.replaceChildren(...options);
    if(options.some(option=&gt;option.value===selected))select.value=selected;
    select.dataset.primaryActivityTypes='true';
  }
  function normalizeLabels(root){
    root.querySelectorAll('#installType').forEach(select=&gt;configureActivitySelect(select,false));
    root.querySelectorAll('#installEditType').forEach(select=&gt;configureActivitySelect(select,true));
    root.querySelectorAll('.install-job-progress .install-stage').forEach(stage=&gt;{
      const name=stage.children[1];
      if(name?.textContent.trim()==='Hauling'){stage.remove();return}
      const replacements={'Site':'Site readiness','Stone':'Stone footing','Install':'Wall install','Closeout':'Field closeout'};
      if(name&amp;&amp;replacements[name.textContent.trim()])name.textContent=replacements[name.textContent.trim()];
      const title=stage.querySelector('small');
      if(name)stage.setAttribute('title',`${name.textContent.trim()}: ${title?.textContent.trim()||'not started'}`);
      if(title)title.setAttribute('aria-label',`${name?.textContent.trim()||'Field activity'} status`);
    });
    root.querySelectorAll('.install-card strong,.install-week-cell button strong').forEach(node=&gt;{
      const key=node.textContent.trim().toLowerCase().replaceAll(' ','_');
      const label=labels.get(key);if(label&amp;&amp;node.textContent!==label)node.textContent=label;
    });
    root.querySelectorAll('.install-job-next span').forEach(node=&gt;{
      const current=node.textContent,next=current.replace(/site preparation/gi,'site readiness').replace(/wall installation/gi,'wall install');if(next!==current)node.textContent=next;
    });
  }
  const observer=new MutationObserver(()=&gt;normalizeLabels(document));
  observer.observe(document.body,{childList:true,subtree:true});
  normalizeLabels(document);
})();
